name: Compiler checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Translate the complete Three.js demo to Haxe
        run: npx --no-install silicanto emit examples/nacar/main.js --out dist/ci-source

  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup:c
      - run: npm run test:roundtrip
      - run: npm run test:haxe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm run setup:java
      - run: npm run test:java
      - run: npx playwright install chromium
      - run: npm run test:generic
      - name: Compare native WebGL frames on a Metal device
        run: |
          metal=$(xcrun swift -e 'import Metal; print(MTLCreateSystemDefaultDevice() != nil)')
          if [ "$metal" = true ]; then
            npm run test:webgl
          else
            echo "WebGL pixel tests skipped because the runner exposes no Metal device." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm ci --prefix tests/phaser4
      - run: npm run test:source-libraries
      - name: Compile the graphical Java application (no GPU needed to build)
        run: npx --no-install silicanto build examples/nacar/main.js --target java --name Nacar --out dist/ci-java
      - name: Build portable JVM fixture
        run: npx --no-install silicanto build tests/fixtures/modules/main.js --target java --out dist/jvm-logic
      - uses: actions/upload-artifact@v4
        with:
          name: portable-jvm-fixture
          path: dist/jvm-logic/java/Sample.jar
          retention-days: 1

  portable-java:
    needs: native
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: portable-jvm-fixture
      - name: Run the Mac-built logic JAR unchanged
        shell: bash
        run: test "$(java -jar Sample.jar | tr -d '\r')" = "15.625"
